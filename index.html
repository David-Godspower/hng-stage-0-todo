<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David Ajala | HNG14 Stage 0 Submission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .done-state { text-decoration: line-through; color: #9ca3af; }
    </style>
</head>
<body class="bg-[#f8fafc] flex items-center justify-center min-h-screen p-6 font-sans">

    <article data-testid="test-todo-card" class="bg-white w-full max-w-md rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-slate-100 p-8 transition-all hover:shadow-xl">
        
        <div class="flex justify-between items-start mb-6">
            <div class="space-y-1">
                <h2 data-testid="test-todo-title" id="title" class="text-2xl font-extrabold text-slate-800 tracking-tight">
                    HNG Stage 0 Submission
                </h2>
                <p data-testid="test-todo-description" class="text-slate-500 text-sm leading-relaxed">
                    Build a high-fidelity, accessible task card with real-time countdown logic.
                </p>
            </div>
            <div class="flex flex-col items-center">
                <input type="checkbox" data-testid="test-todo-complete-toggle" id="toggle" 
                    class="w-7 h-7 rounded-full border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer transition-all"
                    onclick="handleToggle()">
                <label for="toggle" class="sr-only">Mark Task as Complete</label>
            </div>
        </div>

        <div class="flex flex-wrap gap-2 mb-6">
            <span data-testid="test-todo-priority" class="px-3 py-1 bg-rose-50 text-rose-600 text-[10px] font-black uppercase tracking-widest rounded-lg border border-rose-100">High</span>
            <span data-testid="test-todo-status" id="status" class="px-3 py-1 bg-amber-50 text-amber-600 text-[10px] font-black uppercase tracking-widest rounded-lg border border-amber-100">In Progress</span>
        </div>

        <div class="bg-slate-50 rounded-2xl p-4 mb-6 space-y-2 border border-slate-100">
            <div class="flex items-center gap-2 text-slate-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <time data-testid="test-todo-due-date" id="due-date-text" class="text-xs font-bold uppercase tracking-tight"></time>
            </div>
            <div class="flex items-center gap-2 text-indigo-600">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <time data-testid="test-todo-time-remaining" id="time-remaining" class="text-xs font-bold italic animate-pulse"></time>
            </div>
        </div>

        <ul data-testid="test-todo-tags" class="flex flex-wrap gap-2 mb-8" role="list">
            <li data-testid="test-todo-tag-work" class="px-2 py-1 bg-slate-100 text-slate-500 text-[11px] font-medium rounded-md">#work</li>
            <li data-testid="test-todo-tag-urgent" class="px-2 py-1 bg-slate-100 text-slate-500 text-[11px] font-medium rounded-md">#urgent</li>
        </ul>

        <div class="flex items-center justify-between pt-6 border-t border-slate-50">
            <button data-testid="test-todo-edit-button" onclick="console.log('Edit')" aria-label="Edit Task" class="text-slate-400 hover:text-indigo-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
            </button>
            <button data-testid="test-todo-delete-button" onclick="alert('Delete')" aria-label="Delete Task" class="text-slate-400 hover:text-rose-600 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
        </div>
    </article>

    <script src="script.js"></script>
</body>
</html>
